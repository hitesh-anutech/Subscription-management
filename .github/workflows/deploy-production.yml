name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Show deployment target
        run: |
          echo "Host: $(hostname)"
          echo "User: $(whoami)"

      - name: Deploy production
        run: |
          sudo -n /usr/local/sbin/deploy-subscription-management
